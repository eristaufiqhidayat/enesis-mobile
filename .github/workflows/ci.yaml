name: CI

on:
  push:
    branches: [feature/aplikasi-motoris, main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependensi
        run: flutter pub get

      # Hanya error yang menggagalkan CI; info & warning tetap tercetak di log.
      - name: Analisis kode
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Jalankan tes
        run: flutter test
